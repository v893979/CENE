product: ap_invoices
owner: finance-data
key_column: invoice_id
freshness:
  sla_seconds: 3600
lineage:
  upstreams:
  - erp_purchase_orders
  - vendor_master
columns:
  invoice_id:
    type: string
    criticality: 3
    pattern: ^INV-\d{6}$
  vendor_id:
    type: string
    criticality: 3
    pattern: ^V-\d{3}$
  account_id:
    type: string
    criticality: 3
    pattern: ^ACC-\d{4}$
  amount:
    type: number
    criticality: 3
    min: 0
    max: 50000
  discount_pct:
    type: number
    criticality: 2
    min: 0
    max: 10
  currency:
    type: string
    criticality: 2
    allowed:
    - AUD
  status:
    type: string
    criticality: 2
    allowed:
    - open
    - paid
  vendor_notes:
    type: string
    criticality: 1
tools:
  read:
    lookup_invoice:
      handler: lookup
      key: invoice_id
      args:
        invoice_id: ^INV-\d{6}$
  write:
    approve_payment:
      args:
        invoice_id: ^INV-\d{6}$
        account_id: ^ACC-\d{4}$
        amount:
          type: number
          min: 0.01
      limits:
        amount_max: 50000
      bind:
        keys:
        - invoice_id
        - account_id
        max:
          amount: amount
        where:
          status: open
temporal:
- name: one_payment_per_invoice
  tool: approve_payment
  type: once_per
  by:
  - invoice_id
  window_seconds: 2592000
- name: hourly_payment_ceiling
  tool: approve_payment
  type: sum_within
  field: amount
  by: []
  window_seconds: 3600
  max: 400000
escrow:
  approvers_required: 2
