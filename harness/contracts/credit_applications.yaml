product: credit_applications
owner: lending-data
key_column: app_id
freshness:
  sla_seconds: 86400
lineage:
  upstreams:
  - bureau_feed
  - open_banking_feed
columns:
  app_id:
    type: string
    criticality: 3
    pattern: ^LA-\d{5}$
  requested_amount:
    type: number
    criticality: 3
    min: 10000
    max: 500000
  dscr:
    type: number
    criticality: 3
    min: 0
    max: 10
  bureau_score:
    type: number
    criticality: 3
    min: 300
    max: 900
  bureau_age_days:
    type: number
    criticality: 3
    min: 0
    max: 365
  cash_trend:
    type: number
    criticality: 2
    min: -1
    max: 1
  revenue:
    type: number
    criticality: 2
    min: 0
zero_tolerance:
- column: bureau_age_days
  rule: max
  value: 30
tools:
  write:
    book_loan:
      args:
        app_id: ^LA-\d{5}$
        amount:
          type: number
          min: 1000
      limits:
        amount_max: 500000
      bind:
        keys:
        - app_id
        max:
          amount: requested_amount
temporal:
- name: one_loan_per_application
  tool: book_loan
  type: once_per
  by:
  - app_id
  window_seconds: 31536000
