id: uc10
title: Telecommunications retention offers (multi-agent delegation)
book_ref: "Field guide, Chapter 4, Use Case 10"
summary: >
  An orchestrator agent delegates customer conversations to a retention sub-agent. Failure
  replicated: the sub-agent inherits the orchestrator's full authority and gives away large
  credits. Fixes: attenuated delegation - the child token can only drop tools, lower limits and
  keep a subset of bound rows; it cannot exceed the parent, add tools, or delegate without limit.
seed: 20

contracts:
  - product: retention_offers
    owner: customer-data
    key_column: subscriber_id
    freshness: {sla_seconds: 3600}
    lineage: {upstreams: [billing_system]}
    columns:
      subscriber_id: {type: string, criticality: 3, pattern: '^SUB-\d{6}$'}
      tenure_months: {type: number, criticality: 2, min: 0, max: 600}
      monthly_bill: {type: number, criticality: 2, min: 0, max: 1000}
      churn_risk: {type: number, criticality: 3, min: 0, max: 1}
      offer_ceiling: {type: number, criticality: 3, min: 0, max: 1200}
    tools:
      write:
        apply_credit:
          args: {subscriber_id: '^SUB-\d{6}$', credit_amount: {type: number, min: 1}, duration_months: {type: number, min: 1}}
          limits: {credit_amount_max: 1200, duration_months_max: 24}
          bind: {keys: [subscriber_id], max: {credit_amount: offer_ceiling}}

data:
  retention_offers:
    rows: 300
    seed: 10
    columns:
      subscriber_id: {gen: seq, prefix: "SUB-", digits: 6}
      tenure_months: {gen: int, mean: 40, sd: 20, clip: [1, 200]}
      monthly_bill: {gen: normal, mean: 85, sd: 25, clip: [20, 300], round: 2}
      churn_risk: {gen: normal, mean: 0.3, sd: 0.1, clip: [0, 1], round: 3}
      offer_ceiling: {gen: normal, mean: 600, sd: 200, clip: [50, 1200], round: 0}
lineage: {billing_system: 1.0}

steps:
  - {name: "Orchestrator token", do: issue, as: parent, agent: orchestrator, products: [retention_offers], expect: {tier: 1}}
  - {name: "Delegate to the retention sub-agent: max $15 credit for 6 months", do: delegate, parent: parent, as: child, agent: retention-subagent, tools: {apply_credit: {limits: {credit_amount_max: 15, duration_months_max: 6}}}, expect: {result: ok}}
  - {name: "Sub-agent gives a $15 credit for 6 months", do: call, token: child, tool: apply_credit, from_binding: {binding: 0}, override: {credit_amount: 15, duration_months: 6}, expect: {decision: allowed}}
  - {name: "Sub-agent tries a $1,200 handset subsidy", do: call, token: child, tool: apply_credit, from_binding: {binding: 1}, override: {credit_amount: 1200, duration_months: 6}, expect: {decision: denied, code: ARG_OUT_OF_BOUNDS}}
  - {name: "Sub-agent tries 24 months", do: call, token: child, tool: apply_credit, from_binding: {binding: 2}, override: {credit_amount: 10, duration_months: 24}, expect: {decision: denied, code: ARG_OUT_OF_BOUNDS}}
  - {name: "Delegation that raises the limit above the parent's", do: delegate, parent: parent, as: bad1, agent: retention-subagent, tools: {apply_credit: {limits: {credit_amount_max: 5000}}}, expect: {result: DELEGATION_ESCALATION}}
  - {name: "Delegation of a tool the parent does not hold", do: delegate, parent: parent, as: bad2, agent: retention-subagent, tools: {cancel_contract: {}}, expect: {result: DELEGATION_ESCALATION}}
  - {name: "Sub-agent delegates further, narrower again", do: delegate, parent: child, as: grandchild, agent: callback-bot, tools: {apply_credit: {limits: {credit_amount_max: 10}}}, expect: {result: ok}}
  - {name: "Third level of delegation is refused", do: delegate, parent: grandchild, as: bad3, agent: another-bot, tools: {apply_credit: {}}, expect: {result: DELEGATION_TOO_DEEP}}
  - {name: "Child token cannot be edited to raise its limit", do: tamper_token, from: child, as: child_x, set: {sub: orchestrator}}
  - {name: "Edited token refused", do: call, token: child_x, tool: apply_credit, from_binding: {binding: 3}, override: {credit_amount: 15, duration_months: 6}, expect: {decision: denied, code: TOKEN_BAD_SIGNATURE}}
  - {name: "Baseline: without delegation limits the $1,200 credit executes", do: direct, tool: apply_credit, args: {subscriber_id: SUB-000002, credit_amount: 1200, duration_months: 24}}
